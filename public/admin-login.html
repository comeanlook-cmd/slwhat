<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Soori Washing</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="section alt"><div class="container" style="max-width:460px"><div class="card"><img src="/assets/logo.svg" style="width:230px;display:block;margin:auto"><h1 style="text-align:center">Admin Login</h1><p class="muted" style="text-align:center">Authorized staff only</p><form id="f"><div class="field"><label>Username</label><input name="username" autocomplete="username" required></div><div class="field" style="margin-top:14px"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div><button class="btn primary" style="margin-top:18px;width:100%">Sign In</button></form><p id="m"></p></div></div></main><script>
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:f.get("username"),password:f.get("password")})});const d=await r.json();if(r.ok)location.href="/admin.html";else document.getElementById("m").innerHTML="<b style='color:#b91c1c'>"+(d.error||"Login failed")+"</b>"};
</script></body></html>
