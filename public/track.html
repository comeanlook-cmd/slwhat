<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track | Soori Washing</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="nav"><div class="container navin"><a class="brand" href="/"><img src="/assets/logo.svg" alt="Soori Washing"></a><nav class="links"><a href="/">Home</a><a href="/services.html">Services</a><a href="/order.html">Order</a><a href="/track.html">Track Order</a><a href="/contact.html">Contact</a><a class="btn primary" href="/admin.html">Admin</a></nav></div></header><main><section class="section"><div class="container"><h1>Track Your Order</h1><div class="grid2"><form id="track-form" class="card"><label>Order number</label><input id="track-id" required placeholder="SW-20260907-ABC123"><p><button class="btn primary">Track</button></p></form><div id="track-result" class="card"><p class="muted">Enter your order number to see the current status.</p></div></div></div></section></main><footer class="footer"><div class="container"><b>Soori Washing</b><p>+94 777400300 • Kadawatha, Sri Lanka</p><p>Washing • Dry Cleaning • Ironing • Wedding Suits • Bedding</p></div></footer><script src="/js/app.js"></script><script>
const params=new URLSearchParams(location.search);if(params.get("id"))document.getElementById("track-id").value=params.get("id");
document.getElementById("track-form").onsubmit=async e=>{e.preventDefault();const id=document.getElementById("track-id").value.trim();const r=await fetch("/api/orders/"+encodeURIComponent(id));const box=document.getElementById("track-result");if(!r.ok){box.innerHTML="<b>Order not found.</b>";return;}const o=await r.json();box.innerHTML=`<div class="order-id">${o.id}</div><p><b>${o.customerName}</b> • ${o.phone}</p><p>Status: <span class="badge">${o.status}</span></p>${o.items.map(x=>`<div class="price-row"><span>${x.service} × ${x.qty}</span><b>${x.lineTotal?"LKR "+Number(x.lineTotal).toLocaleString("en-LK"):"Quote"}</b></div>`).join("")}<div class="total"><span>Total</span><span>LKR ${Number(o.total||0).toLocaleString("en-LK")}</span></div>`;};
</script></body></html>
